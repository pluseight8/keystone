[package]
name = "keystone-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "keystone_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = { version = "2", features = ["rustls-tls"], optional = true }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
url = "2"
time = { version = "0.3", features = ["parsing"] }
serde_json = "1"
notify = "7"
pdf-extract = "0.7"
rfd = "0.15"
base64 = "0.22"
ring = "0.17.14"
libc = "0.2"
# Plain-HTTP client for local model servers only: no TLS, no cookies, no proxy support compiled in.
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
