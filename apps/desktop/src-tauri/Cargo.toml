[package]
name = "keystone-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "keystone_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"
time = { version = "0.3", features = ["parsing"] }
enigo = "0.2"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
